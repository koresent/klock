[package]
name = "klock"
version = "0.1.0"
edition = "2024"
authors = ["Koresent <koresent@pm.me>"]
license = "GPL-3.0-or-later"
description = "High-performance Wayland session lockscreen matching kgreet styling"

[dependencies]
# Wayland core & session-lock protocol
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop", "xkbcommon"] }
calloop = "0.14"

# 2D Software rendering & typography
tiny-skia = "0.12"
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
fastblur = "0.1"

# PAM Authentication & secure memory
pam-client = "0.5"
zeroize = { version = "1.9", features = ["alloc", "derive"] }

# Configuration & CLI
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
clap = { version = "4.5", features = ["derive"] }

# Logging & error handling
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
libc = "0.2"
